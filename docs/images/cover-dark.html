<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>llm-batch-msg-label · Cover</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" id="theme-link" href="assets/themes/tokyo-night.css">
<link rel="stylesheet" href="assets/animations/animations.css">
<style>
  html,body{margin:0;padding:0;background:#1a1b26}
  .deck{width:1280px;height:640px;position:relative;overflow:hidden;border-radius:24px}
  .slide{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:60px 80px;box-sizing:border-box;opacity:1!important;position:relative!important;background:#1a1b26}
  .tag-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
  .tag{padding:10px 24px;border-radius:10px;font-size:18px;font-weight:600;font-family:var(--font-mono)}
  .tag-primary{background:var(--accent);color:#fff}
  .tag-secondary{background:rgba(255,255,255,.08);color:var(--text-2);border:1px solid rgba(255,255,255,.12)}
  .footer{position:absolute;bottom:28px;left:80px;right:80px;display:flex;justify-content:space-between;color:var(--text-3);font-size:15px;font-family:var(--font-mono)}
</style>
</head>
<body>
<div class="deck">
  <section class="slide">
    <p style="font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-family:var(--font-mono)">LLM Batch Labeling</p>
    <h1 style="font-family:var(--font-mono);font-size:72px;line-height:1.08;font-weight:800;margin:20px 0 16px;color:#c0caf5">llm-batch-<span style="color:var(--accent)">msg-label</span></h1>
    <p style="font-size:26px;color:var(--text-2);line-height:1.5;font-weight:300">用 LLM 对客户对话批量打标签</p>
    <div class="tag-row">
      <span class="tag tag-primary">断点续跑</span>
      <span class="tag tag-secondary">Evidence 举证</span>
      <span class="tag tag-secondary">零代码标签</span>
      <span class="tag tag-secondary">鲁棒解析</span>
      <span class="tag tag-secondary">三级并发</span>
    </div>
    <div class="footer">
      <span>github.com/sadjjk/llm-batch-msg-label</span>
      <span>Python CLI</span>
    </div>
  </section>
</div>
</body>
</html>
